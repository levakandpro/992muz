    if (current && !current.wrap.contains(e.target)) current.close();
  });

  var roleSel = byId('tpRole');
  var placeSel = byId('tpPlace');
  var searchEl = byId('tpSearch');
  var listEl = byId('topList');
  var toolsEl = byId('tpAllTools');
  var metaEl = byId('tpMeta');
  var foundEl = byId('tpFound');
  var resetEl = byId('tpReset');

  enhance(roleSel, 'role');
  enhance(placeSel, 'place');

  function updateMeta() {
    if (toolsEl.hidden) return;
    var isActive = !!(roleSel.value || placeSel.value || searchEl.value.trim());
    var n = listEl.querySelectorAll('.tp-item').length;
    foundEl.textContent = t('found') + ': ' + n;
    resetEl.textContent = t('reset');
    resetEl.hidden = !isActive;
    metaEl.hidden = false;
  }

  resetEl.addEventListener('click', function () {
    roleSel.selectedIndex = 0;
    placeSel.selectedIndex = 0;
    searchEl.value = '';
    dds.forEach(function (d) { d.sync(); });
    roleSel.dispatchEvent(new Event('change', { bubbles: true }));
  });

  if (window.MutationObserver) {
    new MutationObserver(updateMeta).observe(listEl, { childList: true });
  }
  document.addEventListener('tl:lang', updateMeta);
})();
</script>
<script>
(function () {
  'use strict';
  var lb = document.getElementById('tpLb');
  var img = document.getElementById('tpLbImg');
  var nameEl = document.getElementById('tpLbName');
  var openEl = document.getElementById('tpLbOpen');
  var closeEl = document.getElementById('tpLbClose');
  var I18N = {
    ru: { open: 'Открыть анкету', close: 'Закрыть' },
    en: { open: 'Open profile', close: 'Close' },
    tj: { open: 'Кушодани анкета', close: 'Пӯшидан' }
  };
  var lastFocus = null;
  var y0 = null;

  function tt(k) {
    var c = window.TLSite && window.TLSite.lang ? window.TLSite.lang() : 'ru';
    return (I18N[c] || I18N.ru)[k];
  }

  function open(p) {
    lastFocus = document.activeElement;
    img.referrerPolicy = 'no-referrer';
    img.src = p.photo;
    img.alt = p.name || '';
    nameEl.textContent = p.name || '';
    openEl.href = 'talents.html?id=' + encodeURIComponent(p.id);
    openEl.textContent = tt('open');
    closeEl.setAttribute('aria-label', tt('close'));
    lb.hidden = false;
    closeEl.focus();
  }

  function close() {
    if (lb.hidden) return;
    lb.hidden = true;
    img.removeAttribute('src');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  window.tpOpenPhoto = open;
  closeEl.addEventListener('click', close);
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !lb.hidden) close();
  });
  lb.addEventListener('touchstart', function (e) {
    y0 = e.touches.length === 1 ? e.touches[0].clientY : null;
  }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (y0 === null) return;
    var dy = e.changedTouches[0].clientY - y0;
    y0 = null;
    if (dy > 90) close();
  }, { passive: true });
})();
</script>

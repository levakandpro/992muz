<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — 992MUZ</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://992muz.ru/">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body{
      background:var(--bg,#0d0d0d);
      color:var(--text,#e0e0e0);
      font-family:'Inter',sans-serif;
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
      box-sizing:border-box;
    }
    .nf-wrap{ max-width:420px; }
    .nf-logo{ width:64px; height:64px; margin-bottom:24px; }
    .nf-code{
      font-size:80px;
      font-weight:800;
      letter-spacing:-0.03em;
      line-height:1;
      background:linear-gradient(180deg,#8B1A2F,#c2185b);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      margin:0 0 8px;
    }
    .nf-title{
      font-size:20px;
      font-weight:700;
      color:var(--text,#fff);
      margin:0 0 10px;
    }
    .nf-sub{
      font-size:14px;
      color:var(--text2,#999);
      line-height:1.6;
      margin:0 0 28px;
    }
    .nf-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .nf-btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:12px 24px; border-radius:100px;
      font-size:13.5px; font-weight:700;
      text-decoration:none; cursor:pointer; border:none;
      transition:opacity .18s;
    }
    .nf-btn:hover{ opacity:.85; }
    .nf-btn.primary{ background:var(--accent,#8B1A2F); color:#fff; }
    .nf-btn.secondary{ background:var(--bg3,#1e1e1e); color:var(--text,#fff); border:1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <div class="nf-wrap">
    <img class="nf-logo" src="assets/png/red.png" alt="992MUZ" onerror="this.style.display='none'">
    <div class="nf-code">404</div>
    <div class="nf-title">Страница не найдена</div>
    <p class="nf-sub">Такой страницы не существует — возможно, она была удалена или в ссылке опечатка.</p>
    <div class="nf-actions">
      <a class="nf-btn primary" href="/">На главную</a>
      <a class="nf-btn secondary" href="/artists.html">Артисты</a>
    </div>
  </div>
</body>
</html>
